<mat-card class="card">
  <mat-card-header>
    <mat-card-title>{{ 'plugin.messaging.settings.title' | translate }}</mat-card-title>
  </mat-card-header>

  <mat-card-content class="card-content">
    <hmdm-text-input
      class="card-input"
      inputType="number"
      [formControl]="purgeControl"
      [label]="'plugin.messaging.settings.message.purge.period' | translate"
    ></hmdm-text-input>

    <button matButton="filled" class="primary" (click)="onPurge()">
      {{ 'plugin.messaging.settings.message.purge.button' | translate }}
    </button>
  </mat-card-content>
</mat-card>
