<div class="messaging scroll-content">
  <mat-card class="card scroll-content" [hmdmLoader]="isLoadingMessages()">
    <mat-card-title class="card-title">
      <h3>{{ 'breadcrumb.plugin.messaging.main' | translate }}</h3>

      <hmdm-search-container
        persistKey="messaging-search-control"
        [searchControl]="tableSearchControl"
        [filtersTemplate]="filtersTemplate"
        [activeFiltersCount]="activeFiltersCount()"
        [showSearchButton]="false"
      ></hmdm-search-container>

      <ng-template #filtersTemplate>
        <messaging-search-form
          persistFormKey="messaging-search-form"
          [formGroup]="formGroup"
          [hmdmPersistForm]="formGroup"
        ></messaging-search-form>
      </ng-template>

      <button matButton="filled" class="card-btn primary" (click)="onNewMessageClick()">
        <mat-icon>add</mat-icon>
        {{ 'plugin.messaging.button.newMessage' | translate }}
      </button>
    </mat-card-title>

    <mat-divider></mat-divider>

    <mat-card-content class="card-content scroll-content">
      <messaging-messages-table #table class="scroll-table"></messaging-messages-table>
    </mat-card-content>
  </mat-card>
</div>
