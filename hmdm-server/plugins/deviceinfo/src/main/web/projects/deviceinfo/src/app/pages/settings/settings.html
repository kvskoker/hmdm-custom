<mat-card class="card" [hmdmLoader]="isLoadingSettings()">
  <mat-card-header class="card-header">
    <mat-card-title>{{ 'plugin.deviceinfo.title' | translate }}</mat-card-title>

    <button matButton="filled" class="primary" (click)="onSave()" [disabled]="formGroup.invalid">
      <mat-icon>save</mat-icon>
      {{ 'button.save' | translate }}
    </button>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="formGroup" class="card-form">
      <hmdm-text-input
        formControlName="dataPreservePeriod"
        inputType="number"
        [label]="'plugin.deviceinfo.settings.data.preserve.period' | translate"
      ></hmdm-text-input>

      <hmdm-checkbox
        formControlName="sendData"
        [label]="'plugin.deviceinfo.settings.send.data' | translate"
      ></hmdm-checkbox>

      <hmdm-selector
        formControlName="intervalMins"
        [label]="'plugin.deviceinfo.settings.interval.mins' | translate"
        [options]="intervalOptions"
      ></hmdm-selector>
    </form>
  </mat-card-content>
</mat-card>
