<form [formGroup]="formGroup()">
  <hmdm-selector
    formControlName="scope"
    [label]="'plugin.push.label.scope' | translate"
    [options]="scopeOptions"
  ></hmdm-selector>

  @if (scope === 'device') {
    <hmdm-async-select-search
      formControlName="deviceNumber"
      [label]="'plugin.push.label.device' | translate"
      [autocompleteServiceProps]="deviceAutocompleteService"
    ></hmdm-async-select-search>
  }

  @if (scope === 'group') {
    <hmdm-selector
      formControlName="groupId"
      [label]="'plugin.push.label.group' | translate"
      [options]="groupsOptions()"
    ></hmdm-selector>
  }

  @if (scope === 'configuration') {
    <hmdm-selector
      formControlName="configurationId"
      [label]="'plugin.push.label.configuration' | translate"
      [options]="configurationsOptions()"
    ></hmdm-selector>
  }

  <hmdm-selector
    formControlName="messageType"
    [label]="'plugin.push.label.messageType' | translate"
    [options]="messageTypeOptions"
  ></hmdm-selector>

  @if (isCustomMessageType) {
    <hmdm-text-input
      formControlName="customMessageType"
      [label]="'plugin.push.label.customMessageType' | translate"
    ></hmdm-text-input>
  }

  <hmdm-textarea-input
    formControlName="payload"
    [label]="'plugin.push.label.payload' | translate"
    [rows]="5"
  ></hmdm-textarea-input>

  <hmdm-textarea-input
    formControlName="comment"
    [label]="'table.heading.plugin.push.comment' | translate"
    [rows]="3"
  ></hmdm-textarea-input>

  <p class="form-hint">{{ 'plugin.push.schedule.hint' | translate }}</p>

  <div class="form-cron">
    <hmdm-text-input
      class="form-particle"
      formControlName="min"
      [label]="'table.heading.plugin.push.min' | translate"
    ></hmdm-text-input>

    <hmdm-text-input
      class="form-particle"
      formControlName="hour"
      [label]="'table.heading.plugin.push.hour' | translate"
    ></hmdm-text-input>

    <hmdm-text-input
      class="form-particle"
      formControlName="day"
      [label]="'table.heading.plugin.push.day' | translate"
    ></hmdm-text-input>

    <hmdm-text-input
      class="form-particle"
      formControlName="month"
      [label]="'table.heading.plugin.push.month' | translate"
    ></hmdm-text-input>

    <hmdm-text-input
      class="form-particle"
      formControlName="weekday"
      [label]="'table.heading.plugin.push.weekday' | translate"
    ></hmdm-text-input>
  </div>
</form>
