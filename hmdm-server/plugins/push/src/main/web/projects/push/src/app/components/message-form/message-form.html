<form [formGroup]="formGroup()">
  <hmdm-selector
    formControlName="scope"
    [label]="'plugin.push.label.scope' | translate"
    [options]="scopeOptions"
  ></hmdm-selector>

  @if (scope === 'device') {
    <hmdm-async-select-search
      formControlName="deviceNumber"
      [label]="'plugin.push.label.device' | translate"
      [autocompleteServiceProps]="deviceAutocompleteService"
    ></hmdm-async-select-search>
  }

  @if (scope === 'group') {
    <hmdm-selector
      formControlName="groupId"
      [label]="'plugin.push.label.group' | translate"
      [options]="groupsOptions()"
    ></hmdm-selector>
  }

  @if (scope === 'configuration') {
    <hmdm-selector
      formControlName="configurationId"
      [label]="'plugin.push.label.configuration' | translate"
      [options]="configurationsOptions()"
    ></hmdm-selector>
  }

  <hmdm-selector
    formControlName="messageType"
    [label]="'plugin.push.label.messageType' | translate"
    [options]="messageTypeOptions"
  ></hmdm-selector>

  @if (isCustomMessageType) {
    <hmdm-text-input
      formControlName="customMessageType"
      [label]="'plugin.push.label.customMessageType' | translate"
    ></hmdm-text-input>
  }

  <hmdm-textarea-input
    formControlName="payload"
    [label]="'plugin.push.label.payload' | translate"
    [rows]="5"
  ></hmdm-textarea-input>
</form>
