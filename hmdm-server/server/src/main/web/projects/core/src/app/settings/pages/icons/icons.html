<div class="icons scroll-content">
  <mat-card class="card scroll-content" [hmdmLoader]="isLoadingIcons()">
    <mat-card-title class="card-title">
      <h3>{{ 'form.settings.icons.title' | translate }}</h3>

      <hmdm-search-container
        persistKey="icons-search-control"
        [searchControl]="iconsSearchControl"
        [showFiltersButton]="false"
      ></hmdm-search-container>

      <button matButton="filled" class="card-btn primary" (click)="onAddIconClick()">
        <mat-icon>add</mat-icon>
        {{ 'button.add' | translate }}
      </button>
    </mat-card-title>

    <mat-divider></mat-divider>

    <mat-card-content class="card-content scroll-content">
      <core-icon-table class="scroll-table"></core-icon-table>
    </mat-card-content>
  </mat-card>
</div>
