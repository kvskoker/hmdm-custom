@if (isLoading) {
  <div class="auth-loading">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
} @else if (formGroup) {
  <form class="auth-form" [formGroup]="formGroup">
    <h1 class="auth-title">{{ 'reset.password.title' | translate }}</h1>

    <p class="auth-description">{{ 'reset.password.description' | translate }}</p>

    <hmdm-text-input
      inputType="password"
      formControlName="newPassword"
      [label]="'form.profile.password.new' | translate"
    ></hmdm-text-input>

    <hmdm-text-input
      inputType="password"
      formControlName="confirm"
      [label]="'form.profile.password.confirm' | translate"
    ></hmdm-text-input>

    <button matButton="filled" class="primary" (click)="onSubmit()">
      {{ 'reset.password.submit' | translate }}
    </button>
  </form>
}
