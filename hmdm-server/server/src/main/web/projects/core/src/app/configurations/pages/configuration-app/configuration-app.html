<div class="applications scroll-content">
  <mat-card class="card scroll-content" [hmdmLoader]="isLoadingApplications()">
    <mat-card-title class="card-title">
      <h3>{{ 'tab.applications' | translate }}</h3>

      <hmdm-search-container
        persistKey="config-app-search-control"
        [searchControl]="tableSearchControl"
        [filtersTemplate]="filtersTemplate"
        [activeFiltersCount]="activeFiltersCount()"
        [showSearchButton]="false"
      ></hmdm-search-container>

      <ng-template #filtersTemplate>
        <hmdm-checkbox
          hmdmPersistControl="config-app-show-system-apps-control"
          [label]="'form.configuration.apps.show.system.apps' | translate"
          [formControl]="systemControl"
        ></hmdm-checkbox>
      </ng-template>

      <button matButton="filled" class="card-btn primary" (click)="onAddApplicationClick()">
        <mat-icon>add</mat-icon>
        {{ 'button.add' | translate }}
      </button>
    </mat-card-title>

    <mat-divider></mat-divider>

    <mat-card-content class="card-content scroll-content">
      <core-configuration-apps-table class="scroll-table"></core-configuration-apps-table>
    </mat-card-content>
  </mat-card>
</div>
