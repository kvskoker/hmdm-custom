<mat-card>
  <mat-card-title>
    <mat-card-header class="card-header">
      <mat-card-title>
        {{ 'form.profile.title' | translate }}
      </mat-card-title>

      <button matButton="filled" class="primary" (click)="onSave()">
        {{ 'button.save' | translate }}
      </button>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="formGroup">
        <hmdm-text-input
          inputType="password"
          formControlName="oldPassword"
          [label]="'form.profile.password.old' | translate"
        ></hmdm-text-input>

        <hmdm-text-input
          inputType="password"
          formControlName="newPassword"
          [label]="'form.profile.password.new' | translate"
        ></hmdm-text-input>

        <hmdm-text-input
          inputType="password"
          formControlName="confirm"
          [label]="'form.profile.password.confirm' | translate"
        ></hmdm-text-input>
      </form>
    </mat-card-content>
  </mat-card-title>
</mat-card>
