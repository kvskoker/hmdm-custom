<div class="groups scroll-content">
  <mat-card class="card scroll-content" [hmdmLoader]="isLoadingGroups()">
    <mat-card-title class="card-title">
      <h3>{{ 'form.settings.groups.title' | translate }}</h3>

      <hmdm-search-container
        persistKey="groups-search-control"
        [searchControl]="groupsSearchControl"
        [showFiltersButton]="false"
      ></hmdm-search-container>

      <button matButton="filled" class="card-btn primary" (click)="onAddGroup()">
        <mat-icon>add</mat-icon>
        {{ 'button.add' | translate }}
      </button>
    </mat-card-title>

    <mat-divider></mat-divider>

    <mat-card-content class="card-content scroll-content">
      <core-groups-table class="scroll-table"></core-groups-table>
    </mat-card-content>
  </mat-card>
</div>
