<div class="users scroll-content">
  <mat-card class="card scroll-content" [hmdmLoader]="isLoadingUsers()">
    <mat-card-title class="card-title">
      <h3>{{ 'form.settings.users.title' | translate }}</h3>

      <hmdm-search-container
        persistKey="users-search-control"
        [searchControl]="usersSearchControl"
        [showFiltersButton]="false"
      ></hmdm-search-container>

      <button matButton="filled" class="card-btn primary" (click)="onAddUserClick()">
        <mat-icon>add</mat-icon>
        {{ 'button.add' | translate }}
      </button>
    </mat-card-title>

    <mat-divider></mat-divider>

    <mat-card-content class="card-content scroll-content">
      <core-user-table class="scroll-table"></core-user-table>
    </mat-card-content>
  </mat-card>
</div>
