<div class="slider" [class.inline]="inline()">
  <div class="slider-label-row">
    <label class="slider-label">{{ label() }}</label>

    @if (help()) {
      <hmdm-help-tooltip [text]="help()" />
    }
  </div>

  <mat-slider [min]="min()" [max]="max()" [step]="step()" [discrete]="showThumbLabel()">
    <input matSliderThumb [formControl]="formControl" />
  </mat-slider>
</div>
