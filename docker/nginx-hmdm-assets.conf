# Include inside the existing MDM HTTPS server block, not inside location /.
# Match only frontend JS/CSS, excluding API responses and uploaded files.
location ~ ^/(?:[^/]+\.(?:js|css)|plugins/[^/]+/[^/]+\.(?:js|css))$ {
    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/javascript application/javascript text/css;
    # No proxy cache: do not risk stale deployment metadata or private responses.
}
